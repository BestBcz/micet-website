# Start with an isolated staging server and test database.
enabled: false
site-url: ""
# Self-hosted mode provides read-only stats and account verification.
self-hosted: false
# Enable only if the backend accepts connections exclusively from a proxy that enforces player login and UUID forwarding.
trust-forwarded-identity: false
# The Site service token applies to private Sites deployments.
site-service-token: ""
bridge-secret: ""
# Create a regular, non-stackable AquaCore Tag with this identifier on staging.
test-tag: MICET_TEST
# Add UUIDs of human test accounts. Empty blocks all grants.
allowed-player-uuids: []
poll-seconds: 3
